# Tests: H2 en memoria con sintaxis MySQL (el upsert de metric usa ON DUPLICATE KEY) y sin conectar a Kafka.
spring.datasource.url=jdbc:h2:mem:analytics;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.kafka.listener.auto-startup=false
spring.kafka.bootstrap-servers=localhost:1
