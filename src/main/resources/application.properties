spring.application.name=analytics-service
server.port=${SERVER_PORT:8091}

# MariaDB local (db_analytics se crea sola). En AWS: DB_URL / DB_USER / DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/db_analytics?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Kafka. Cada @KafkaListener declara su propio consumer group (analytics-aggregator y audit-writer).
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
# Un hilo por partición (los tópicos tienen 3). Con más instancias del servicio las particiones se reparten entre ellas.
spring.kafka.listener.concurrency=3

analytics.topics.business=pcb.business.events
analytics.topics.audit=pcb.audit.events
# Reintentos antes de mandar el mensaje al <tópico>.dlt: intentos y espera inicial (se duplica en cada intento)
analytics.retry.max-attempts=3
analytics.retry.initial-interval-ms=1000

management.endpoints.web.exposure.include=health,info
